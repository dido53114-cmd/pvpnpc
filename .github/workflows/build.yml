name: Compiler le plugin PvpNpc

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compiler avec Maven
        run: mvn -B package --file pom.xml

      - name: Mettre le jar a disposition en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: PvpNpc-jar
          path: target/PvpNpc.jar
